<svg xmlns="http://www.w3.org/2000/svg" width="800" height="208" viewBox="0 0 800 208" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>CADD Calculator UI palette</title>
<rect width="800" height="208" fill="#FFFFFF"/>
<rect x="16" y="16" width="180" height="120" rx="6" fill="#A3122F"/>
<text x="16" y="158" font-size="16" font-weight="600" fill="#21251F">Crimson #A3122F</text>
<text x="16" y="178" font-size="13" fill="#21251F">Primary</text>
<rect x="212" y="16" width="180" height="120" rx="6" fill="#77848B"/>
<text x="212" y="158" font-size="16" font-weight="600" fill="#21251F">Slate #77848B</text>
<text x="212" y="178" font-size="13" fill="#21251F">Muted</text>
<rect x="408" y="16" width="180" height="120" rx="6" fill="#F2BA52"/>
<text x="408" y="158" font-size="16" font-weight="600" fill="#21251F">Amber #F2BA52</text>
<text x="408" y="178" font-size="13" fill="#21251F">Accent</text>
<rect x="604" y="16" width="180" height="120" rx="6" fill="#21251F"/>
<text x="604" y="158" font-size="16" font-weight="600" fill="#21251F">Ink #21251F</text>
