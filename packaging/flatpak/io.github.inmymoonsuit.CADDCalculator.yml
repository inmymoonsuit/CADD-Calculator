# Flathub manifest for CADD Calculator (ADR-0022, distribution slice d4).
#
# Built from source, not from the Nuitka binary: the app is pip-installed onto the KDE
# runtime, with PySide6 from io.qt.PySide.BaseApp. The release workflow builds it on every
# dry run and starts it inside the sandbox. For the Flathub submission, the `dir` source
# below becomes a `git` source with the release's tag and commit (docs/dev/packaging.md,
# "Flathub").
id: io.github.inmymoonsuit.CADDCalculator
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: caddcalc-gui
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
# The app makes no network calls, so there's no --share=network.
build-options:
  env:
    BASEAPP_REMOVE_WEBENGINE: '1'
cleanup-commands:
  - /app/cleanup-BaseApp.sh
modules:
  - python3-build-deps.json

  - name: caddcalc
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --no-deps --no-index --no-build-isolation --prefix=${FLATPAK_DEST} .
      - install -Dm644 packaging/linux/${FLATPAK_ID}.desktop -t ${FLATPAK_DEST}/share/applications/
      - install -Dm644 packaging/linux/${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo/
      - install -Dm644 src/caddcalc/gui/assets/brand/app-icon.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -Dm644 src/caddcalc/gui/assets/brand/app-icon-16.svg ${FLATPAK_DEST}/share/icons/hicolor/16x16/apps/${FLATPAK_ID}.svg
      - install -Dm644 src/caddcalc/gui/assets/brand/app-icon-24.svg ${FLATPAK_DEST}/share/icons/hicolor/24x24/apps/${FLATPAK_ID}.svg
      - install -Dm644 src/caddcalc/gui/assets/brand/app-icon-32.svg ${FLATPAK_DEST}/share/icons/hicolor/32x32/apps/${FLATPAK_ID}.svg
    sources:
      - type: dir
        path: ../..
        skip:
          - .venv
          - builds
          - .git
