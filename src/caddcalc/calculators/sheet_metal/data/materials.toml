# --- Materials: option keys are public. A material has tempers, each with its full name,
# or a name of its own. gauges lists the gauge systems it is ordered by (gauges.toml ids).

[[material]]
key = "al:5052"
label = "5052"
group = "Aluminum"
gauges = ["awg"]
tempers = [{ key = "temper:h32", label = "H32", name = "5052-H32 aluminum" }]

[[material]]
key = "al:6061"
label = "6061"
group = "Aluminum"
gauges = ["awg"]
tempers = [{ key = "temper:t6", label = "T6", name = "6061-T6 aluminum" }]

[[material]]
key = "cs:a1008"
label = "Mild steel, cold-rolled (ASTM A1008 CS)"
group = "Carbon steel"
name = "mild cold-rolled steel (A1008 CS)"
gauges = ["msg", "uss"]

[[material]]
key = "cs:a653"
label = "Galvanized steel (ASTM A653)"
group = "Carbon steel"
name = "galvanized steel (A653)"
gauges = ["galv"]
radius_note = "No public-domain source gives a minimum bend radius for galvanized steel; use the base steel's guidance. The zinc coating can flake or crack on tight bends."

[[material]]
key = "cs:a1011"
label = "Hot-rolled steel, pickled and oiled (ASTM A1011)"
group = "Carbon steel"
name = "hot-rolled pickled and oiled steel (A1011)"
gauges = ["msg", "uss"]
radius_note = "No public-domain source gives a minimum bend radius for hot-rolled pickled and oiled steel; use the base steel's guidance, and bend a test piece first."

[[material]]
key = "ss:304"
label = "304, annealed (2B finish)"
group = "Stainless steel"
gauges = ["uss"]
tempers = [{ key = "temper:annealed", label = "Annealed", name = "304 stainless, annealed (2B finish)" }]

# --- Minimum inside radius. Values are multiples of T (times_t: one value, or a range's
# lower and upper bounds) or radii in the row's unit (radius), one per listed thickness or
# band. angle is the bend angle the source states, or "not_stated".

[[min_radius]]
material = "al:5052"
temper = "temper:h32"
source = "ac_radii_aluminum"
trust = "spec_guidance"
angle = "90"
unit = "in"
thicknesses = ["0.016", "0.032", "0.064", "0.128", "0.182", "0.258"]
times_t = [["0"], ["0"], ["1/2", "1"], ["1/2", "3/2"], ["1/2", "3/2"], ["1/2", "3/2"]]

[[min_radius]]
material = "al:6061"
temper = "temper:t6"
source = "ac_radii_aluminum"
trust = "spec_guidance"
angle = "90"
unit = "in"
thicknesses = ["0.016", "0.032", "0.064", "0.128", "0.182", "0.258"]
times_t = [["0", "1"], ["1/2", "3/2"], ["1", "2"], ["3/2", "3"], ["2", "4"], ["3", "4"]]

[[min_radius]]
material = "al:6061"
temper = "temper:t6"
source = "to_standard_radii_aluminum"
trust = "spec_guidance"
angle = "90"
unit = "in"
thicknesses = [
  "0.012", "0.016", "0.020", "0.025", "0.032", "0.040", "0.050", "0.063",
  "0.071", "0.080", "0.090", "0.100", "0.125", "0.160", "0.190", "0.250",
]
radius = [
  "0.03", "0.03", "0.03", "0.06", "0.09", "0.09", "0.12", "0.16",
  "0.19", "0.22", "0.25", "0.31", "0.38", "0.44", "0.69", "1.00",
]
label = "TO's group with 2014-T4, 2024-T3, 2024-T4, 7075-W, and 7178-W"

[[min_radius]]
material = "cs:a1008"
source = "to_radii_carbon_steel"
trust = "spec_guidance"
angle = "not_stated"
unit = "in"
thicknesses = ["0.016", "0.020", "0.025", "0.032", "0.040", "0.050", "0.063", "0.125", "0.187"]
times_t = [["2"], ["2"], ["2"], ["2"], ["2"], ["2"], ["2"], ["2"], ["2"]]
label = "TO's 1020/1025 row, a conservative stand-in for A1008 CS"

[[min_radius]]
material = "ss:304"
temper = "temper:annealed"
source = "to_radii_stainless"
trust = "spec_guidance"
angle = "not_stated"
unit = "in"
bands = [
  { min = "0.012", max = "0.051" },
  { min = "0.051", max = "0.090", min_inclusive = false },
  { min = "0.190", max = "0.250" },
]
times_t = [["2"], ["2"], ["2"]]
label = "TO's only 304 row, for ½ Hard; a conservative stand-in for annealed 2B sheet"
note = "TO's 2015 edition gives about 1T for generic annealed corrosion-resistant steel."
see_also = ["to_2015_annealed_stainless"]

# --- Bending practice, noted whenever a minimum-radius check applies.

[practice]
source = "to_2015_bending_practice"
note = "Form across the grain where possible, and bend a test piece first; if it cracks, increase the radius by a thickness or more until it doesn't."

# --- Strengths, stated as the source gives them, longitudinal (L) and long transverse
# (LT). Stored with their basis for later use; tonnage would need an upper value.

[[strength]]
material = "al:5052"
temper = "temper:h32"
source = "hdbk5j_5052"
basis = "spec_minimum"
trust = "handbook_rule"
unit = "in"
thickness = { min = "0.017", max = "2.000" }
f_tu = { l = "31 ksi", lt = "31 ksi" }
f_ty = { l = "23 ksi", lt = "22 ksi" }

[[strength]]
material = "al:6061"
temper = "temper:t6"
source = "hdbk5j_6061"
basis = "a_basis"
trust = "handbook_rule"
unit = "in"
thickness = { min = "0.010", max = "0.249" }
f_tu = { l = "42 ksi", lt = "42 ksi" }
f_ty = { l = "36 ksi", lt = "35 ksi" }
note = "Strengths may be lower in material formed or cold-worked in the annealed temper before solution heat treatment."

[[strength]]
material = "cs:a1008"
source = "hdbk5j_1025"
basis = "spec_minimum"
trust = "handbook_rule"
f_tu = { l = "55 ksi", lt = "55 ksi" }
f_ty = { l = "36 ksi", lt = "36 ksi" }
note = "AISI 1025 annealed, a stand-in for A1008 CS; the source states no thickness range."

[[strength]]
material = "ss:304"
temper = "temper:annealed"
source = "hdbk5j_304"
basis = "spec_minimum"
trust = "handbook_rule"
unit = "in"
thickness = { max = "0.187" }
f_tu = { l = "73 ksi", lt = "75 ksi" }
f_ty = { l = "26 ksi", lt = "30 ksi" }
note = "For AMS 5513 material. 2B sheet is commonly bought to ASTM A240/A480, which wasn't checked against these values."

# --- K-factor starting values: labelled rules of thumb, applied only on request (M2).

[[k_start]]
value = "0.445"
source = "faa_neutral_axis"
materials = ["al:5052", "al:6061"]
note = "Stated outright; the handbook's bend-allowance formula implies 0.4475."

[[k_start]]
value = "0.4"
source = "edd5_k"
materials = ["al:5052", "al:6061", "cs:a1008", "ss:304"]
note = "The textbook's instructional value."
