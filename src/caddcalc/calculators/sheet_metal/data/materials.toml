# Sheet-metal materials (ADR-0014 §3, phase 2b).
#
# Each material lists its tempers and the gauge systems it is ordered by. Each value row
# cites one source and states its values as that source does: the minimum inside radius
# as a multiple of the thickness (T) or as a radius, at the source's own listed
# thicknesses or bands; strengths with their basis; and K-factor starting values.
# caddcalc.calculators.sheet_metal.materials turns listed thicknesses into bands (the
# maintainer's decision D4) and checks every value. Changing the data needs a version
# bump; the tests pin its digest.

[table]
schema = 1
name = "Sheet-metal materials"
version = 1

