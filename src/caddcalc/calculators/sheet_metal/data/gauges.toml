# The definition's constants. Each value is exact text, read as a Fraction or a Decimal.

[constant]
steel_basis = { value = "41.82", unit = "lb/ft² per in", source = "steel_basis", trust = "handbook_rule" }
wrought_iron_basis = { value = "40", unit = "lb/ft² per in", source = "wrought_iron_basis", trust = "spec_guidance" }
galvanized_coating = { value = "2.5", unit = "oz/ft²", source = "galvanized_rule", trust = "spec_guidance" }
awg_0000 = { value = "0.46", unit = "in", source = "awg_definition", trust = "spec_guidance" }
awg_36 = { value = "0.005", unit = "in", source = "awg_definition", trust = "spec_guidance" }

# 15 U.S.C. §206, as enacted: weight per square foot in ounces avoirdupois, by gauge.

[weights]
source = "statute_weights"
oz_per_sq_ft = { "0000000" = "320", "000000" = "300", "00000" = "280", "0000" = "260", "000" = "240", "00" = "220", "0" = "200", "1" = "180", "2" = "170", "3" = "160", "4" = "150", "5" = "140", "6" = "130", "7" = "120", "8" = "110", "9" = "100", "10" = "90", "11" = "80", "12" = "70", "13" = "60", "14" = "50", "15" = "45", "16" = "40", "17" = "36", "18" = "32", "19" = "28", "20" = "24", "21" = "22", "22" = "20", "23" = "18", "24" = "16", "25" = "14", "26" = "12", "27" = "11", "28" = "10", "29" = "9", "30" = "8", "31" = "7", "32" = "6.5", "33" = "6", "34" = "5.5", "35" = "5", "36" = "4.5", "37" = "4.25", "38" = "4" }

[[system]]
id = "msg"
name = "Manufacturers' Standard"
scope = "steel sheet"
size_label = "ga"
formula = "weight"
constants = { B = "steel_basis" }
first = "3"
last = "38"
precision = { decimals = 4, rounding = "half_up", source = "steel_basis" }
defined_by = "statute_weights"
checked_against = ["steel_basis"]
tolerances = ["uncoated_steel_tolerances"]

# 32 ga ships as computed, not as the Handbook's Table 2 lists it (ADR-0014, amendments).
[[system]]
id = "galv"
name = "Galvanized"
scope = "coated steel sheet"
size_label = "ga"
formula = "weight"
constants = { B = "steel_basis", c = "galvanized_coating" }
first = "8"
last = "34"
precision = { decimals = 4, rounding = "half_up", source = "steel_basis" }
defined_by = "galvanized_rule"
checked_against = ["steel_basis"]
tolerances = ["coated_steel_tolerances"]

[[system]]
id = "uss"
name = "US Standard 1893"
scope = "as commonly used for stainless; practice varies"
size_label = "ga"
formula = "weight"
constants = { B = "wrought_iron_basis" }
first = "0000000"
last = "38"
precision = { exact = true, source = "statute_weights" }
defined_by = "statute_weights"
checked_against = []
tolerances = ["stainless_tolerances"]

[[system]]
id = "awg"
name = "AWG (Brown & Sharpe)"
scope = "nonferrous"
size_label = "AWG"
formula = "awg"
constants = { d0000 = "awg_0000", d36 = "awg_36" }
first = "0000"
last = "40"
precision = { decimals = 4, rounding = "half_up", below = "0.0100", decimals_below = 5, source = "awg_definition" }
defined_by = "awg_definition"
checked_against = []
tolerances = ["aluminum_sheet", "aluminum_tolerances"]
