# Gauge systems for sheet metal (ADR-0014 §2).
#
# Each system is stored as its definition, never as a copied thickness table: the
# statute's weights, the cited constants, and each system's range and published
# precision. caddcalc.calculators.sheet_metal.gauges holds the formulas and computes every
# thickness exactly. Changing the data needs a version bump; the tests pin its digest.

[table]
schema = 1
name = "Gauge systems"
version = 3

[[publication]]
id = "us_code"
kind = "statute"
title = "United States Code, Title 15"
short_title = "15 U.S.C. (2024 ed.)"
edition = "2024 ed."
url = "https://www.govinfo.gov/link/uscode/15/206?type=usc&year=2024&link-type=html"
license = "public_domain"
public_domain_basis = "17 U.S.C. §105: a work of the US Government"

