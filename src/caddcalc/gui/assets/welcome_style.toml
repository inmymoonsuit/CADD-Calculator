# The welcome screen's design tokens (ADR-0016): every size, colour role, and font it
# uses. gui/welcome_style.py reads and checks them, and refuses unknown keys;
# docs/dev/design/welcome-screen.md documents each, and a test keeps it quoting these
# values. Sizes are logical pixels: 1 px is one device pixel at 100% scaling. Insets,
# margins, and paddings come from the spacing scale (2, 4, 6, 8, 12, 16, 24, 32). Colours
# are palette roles (palette.toml), so the light and dark themes and the contrast tests
# apply.
schema = 1

[art]
slot = [960, 540]                  # the art's area, 16:9
supplied_scale = 2                 # art is supplied at twice the slot's size
formats = [".png", ".jpg", ".jpeg"]
max_bytes = 8_000_000              # the largest art or logo file a pack may name
max_px = 4096                      # the largest art width or height
grid = 60                          # the art template's grid

[card]
corner_radius = 5                  # shrinks with the card on a small screen
border_width = 1
border_role = "card_border"

[top_bar]
height = 32
padding = 4                        # beside its buttons
button_size = 24
separator_width = 1
separator_role = "welcome_line"

[logo]
formats = [".svg", ".png"]
region_width = 96
margin_left = 16                   # minimums
margin_top = 16
margin_bottom = 16
padding = 8                        # inside the box, around the logo
min_short_side = 48                # the box keeps the logo's shape up to this
max_long_side = 320                # so no logo becomes a full-height pillar
border_width = 1
border_role = "welcome_line"
fill_role = "welcome_paper"        # white in both themes: logos are drawn for white

[panes]                            # the name and version panes' shared style
text_roles = ["welcome_ink", "welcome_paper"]
fill_roles = ["welcome_paper", "welcome_ink"]   # each text's own fill: light, then dark
fill_opacity_min = 0.15
border_width = 1                   # in the text's role
percentile = 5                     # of the art under a pane that may fall short
max_background_spread = 1.5        # how much the blended background may vary

[name_pane]
anchor = "top_right"
inset = 24
padding = [8, 16]                  # around the capitals: vertical, horizontal
font = "display"
font_size = 50                     # snaps to the face's pixel grid
min_contrast = 3                   # large text (WCAG 2)
safe_area = [376, 88]              # what the art keeps clear of detail

[version_pane]
anchor = "bottom_right"
inset = 6                          # at least the corner radius plus the border
padding = [2, 4]
font = "body"
font_size = 11
min_contrast = 4.5
safe_area = [200, 24]

[typography]
display_family = "VT323"
display_file = "fonts/vt323/VT323-Regular.ttf"
display_weight = "regular"         # or "bold": Qt's bold, which varies by platform
display_em_pixels = 25             # 1000 units per em, 40 per design pixel
display_cap_height = 0.56          # 560 of 1000 units
fallback_families = ["Consolas", "DejaVu Sans Mono", "Menlo", "monospace"]
min_font_size = 9

[startup]
hold_ms = 1500                     # the card alone, still, before the window shows behind it
