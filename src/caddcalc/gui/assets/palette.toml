# CADD Calculator UI palette, shared by every edition (branded or not).
# Usage rules, swatches, and contrast ratios: docs/dev/design/palette.md.
# tests/test_palette.py enforces the contrast minimums.
schema = 1

[colors]
crimson = "#A3122F"
slate = "#77848B"
amber = "#F2BA52"
ink = "#21251F"
white = "#FFFFFF"

# Roles name a color above. "on_X" is the text or icon color used on top of X.
[light]
background = "white"
text = "ink"
primary = "crimson"     # primary buttons, selection, headings; text on white is fine
on_primary = "white"
accent = "amber"        # highlight fills only; never text on white
on_accent = "ink"
muted = "slate"         # borders, dividers, icons, disabled; not small text
error = "crimson"
on_error = "white"
warning = "amber"
on_warning = "ink"
icon = "slate"          # default icon color
icon_active = "ink"     # selected or emphasized icons
icon_error = "crimson"
icon_warning = "ink"    # amber is too faint on white; the icon shape signals it
text_error = "crimson"  # error messages and headings in results
text_warning = "ink"    # amber text is too faint on white; the icon and wording signal it
outline_error = "crimson"  # border of a field whose text can't be used
outline_note = "ink"    # border of a field a result note concerns; amber is too faint

[dark]
background = "ink"
text = "white"
primary = "crimson"     # fills with white text only; crimson text is too faint on ink
on_primary = "white"
accent = "amber"        # headings, links, focus rings; reads well on ink
on_accent = "ink"
muted = "slate"         # borders, dividers, icons, disabled
error = "crimson"
on_error = "white"
warning = "amber"
on_warning = "ink"
icon = "slate"
icon_active = "white"
icon_error = "white"    # crimson is too faint on ink; the icon shape signals it
icon_warning = "amber"
text_error = "white"    # crimson is too faint on ink; the icon and wording signal it
text_warning = "amber"
outline_error = "white"
outline_note = "amber"
