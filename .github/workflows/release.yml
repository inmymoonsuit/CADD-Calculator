name: Release builds

# Builds and archives the generic edition on version tags, then drafts a release (ADR-0009).
# Branded editions are never built here (ADR-0008 item 4, ADR-0011): the first step fails
# if a branding/ folder exists, and packaging/build.py refuses branded builds in CI.
# Status and limitations: docs/dev/packaging.md, "CI".
#
# Dry runs: a push to the `distribution` branch, or a pull request that touches packaging,
# builds, smoke-tests, and uploads the artifacts on every platform, but never drafts a
# release, signs, or publishes. Only a `v*` tag does those.

on:
  push:
    tags: ["v*"]
    branches: [distribution]
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a dry run; a tag's run is never
# cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Generic / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Ubuntu, so the Linux build runs on older glibc too.
        os: [windows-latest, macos-latest, ubuntu-22.04]
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}/../nuitka-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Refuse to build with a branding pack in the checkout
        shell: bash
        run: |
          if [ -e branding ]; then
            echo "::error::branding/ must never be in the public repository (ADR-0008 item 4)"
            exit 1
          fi

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 ccache
          echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --extra gui --group build --locked

      - name: Cache Nuitka's compiler downloads and ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          key: nuitka-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: nuitka-${{ runner.os }}-

      - name: Build the generic edition, start it, and archive it
        shell: bash
        run: |
          set -o pipefail
          # Windows also wraps the folder in its Inno Setup installer; windows-latest has
          # Inno Setup 6 (slice d3).
          installer=""
          if [ "$RUNNER_OS" = "Windows" ]; then installer="--installer"; fi
          uv run python packaging/build.py --smoke-test --archive $installer 2>&1 \
            | tee build-output.txt

      # Job logs need a signed-in reader, but annotations are public: put the end of a
      # failed build's output, and of pyside6-deploy's log, where anyone can read it.
      - name: Report a failed build as an annotation
        if: failure()
        shell: bash
        run: |
          for f in build-output.txt builds/generic/work/deploy.log; do
            [ -f "$f" ] || continue
            uv run --no-project python -c "import sys; f = sys.argv[1]; tail = open(f, encoding='utf-8', errors='replace').read().splitlines()[-60:]; print('::error title=' + f + '::' + '%0A'.join(x.replace('%', '%25') for x in tail))" "$f"
          done

      # Install silently for this user, start the installed app with --smoke-test, then
      # uninstall and check nothing is left; every step's exit code is checked.
      - name: Install, start, and uninstall the installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: uv run python packaging/windows/test_installer.py builds/generic/*-setup.exe

      - name: Validate the winget manifests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          setup=$(ls builds/generic/*-setup.exe)
          version=$(uv run python -c "import caddcalc; print(caddcalc.__version__)")
          sha=$(sha256sum "$setup" | cut -d' ' -f1)
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/$(basename "$setup")"
          uv run python packaging/windows/winget.py render --version "$version" \
            --url "$url" --sha256 "$sha" --out builds/winget
          uv run --no-project --with jsonschema==4.26.0 --with pyyaml==6.0.3 \
            python packaging/windows/winget.py validate builds/winget

      # Wrap the folder in an AppImage, then start it with --appimage-extract-and-run (no
      # FUSE on the runner) and check its smoke test (slice d4).
      - name: Build and start the AppImage (Linux)
        if: runner.os == 'Linux'
        run: uv run python packaging/linux/make_appimage.py builds/generic/*-linux-x64 --smoke-test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: CADDCalculator-generic-${{ runner.os }}
          path: |
            builds/generic/*.zip
            builds/generic/*.tar.gz
            builds/generic/*-setup.exe
            builds/generic/*.AppImage
            builds/generic/*.build.json
          if-no-files-found: error

  # The .desktop file and the AppStream metainfo, checked with current tools: Ubuntu
  # 22.04's appstreamcli predates the <developer> tag and the vcs-browser URL that Flathub
  # asks for, so this runs on 24.04 (appstream 1.0) rather than in the AppImage's job.
  linux-metadata:
    name: Linux metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install the validators
        run: sudo apt-get update && sudo apt-get install -y appstream desktop-file-utils

      - name: Validate the desktop file and the AppStream metainfo
        shell: bash
        run: |
          appstreamcli --version
          # On failure the tool's own output becomes a public annotation.
          check() {
            local title="$1"; shift
            if ! out=$("$@" 2>&1); then
              echo "::error title=$title::${out//$'\n'/%0A}"
              return 1
            fi
            echo "$out"
          }
          check desktop-file-validate \
            desktop-file-validate packaging/linux/io.github.inmymoonsuit.CADDCalculator.desktop
          check appstreamcli appstreamcli validate --no-net --explain \
            packaging/linux/io.github.inmymoonsuit.CADDCalculator.metainfo.xml

  # Builds the Flathub manifest from source in Flathub's KDE container, then starts the app
  # inside the sandbox with --smoke-test (slice d4). Submitting to Flathub is the
  # maintainer's job (docs/dev/packaging.md, "Flathub").
  flatpak:
    name: Flatpak / from source
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('packaging/flatpak/**') }}
          restore-keys: flatpak-builder-

      # flatpak-builder directly, rather than through flatpak-github-actions, so its log can
      # become a public annotation when it fails.
      - name: Build the Flatpak
        shell: bash
        run: |
          set -o pipefail
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --force-clean --repo=repo build-dir \
            packaging/flatpak/io.github.inmymoonsuit.CADDCalculator.yml 2>&1 \
            | tee flatpak-build.log
          flatpak build-bundle repo CADDCalculator.flatpak io.github.inmymoonsuit.CADDCalculator

      - name: Report a failed Flatpak build as an annotation
        if: failure()
        shell: bash
        run: |
          [ -f flatpak-build.log ] || exit 0
          # The error lines, then the end of the log, leaving out download progress.
          python3 - flatpak-build.log <<'PY'
          import re, sys
          lines = [l.rstrip() for l in open(sys.argv[1], encoding="utf-8", errors="replace")]
          lines = [l for l in lines if l and not re.match(r"^\s*(\d|% Total|Dload)", l)]
          errors = [l for l in lines if re.search(r"error|failed|not found", l, re.I)]
          shown = errors[-25:] + ["----"] + lines[-35:]
          print("::error title=flatpak-builder::" + "%0A".join(l.replace("%", "%25") for l in shown))
          PY

      - name: Start it inside the sandbox
        run: |
          set -eu
          flatpak install --user --noninteractive -y CADDCalculator.flatpak
          report="$GITHUB_WORKSPACE/flatpak-smoke-test"
          flatpak run --env=QT_QPA_PLATFORM=offscreen --filesystem="$GITHUB_WORKSPACE" \
            io.github.inmymoonsuit.CADDCalculator --smoke-test="$report"
          python3 -c "import json, sys; r = json.load(open(sys.argv[1])); print(r); assert r['calculators'] > 0 and r['window_title'] == 'CADD Calculator', r" \
            "$report/smoke-test.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: CADDCalculator-flatpak
          path: CADDCalculator.flatpak
          if-no-files-found: error

  # Signs the Windows installer on a tag, through SignPath Foundation or Microsoft
  # Artifact Signing (ADR-0022). It's switched off until the maintainer sets the repository
  # variable SIGNING_PROVIDER (signpath or artifact-signing) and that provider's variables
  # and secret (docs/dev/packaging.md, "Signing"). Switched off, it leaves a notice and
  # succeeds: it never fails a release over missing settings.
  sign-windows:
    name: Sign the Windows installer
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    # The maintainer approves each signing by hand: the environment's required reviewer.
    # Artifact Signing's Azure login is bound to this environment, so it works nowhere else.
    environment: release-signing
    permissions:
      contents: read
      actions: read  # SignPath downloads the unsigned artifact
      id-token: write  # Artifact Signing signs in to Azure through OIDC
    steps:
      - name: Is signing switched on?
        id: gate
        shell: bash
        env:
          PROVIDER: ${{ vars.SIGNING_PROVIDER }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_POLICY_SLUG: ${{ vars.SIGNPATH_POLICY_SLUG }}
          SIGNPATH_TOKEN_SET: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          off() {
            echo "::notice title=Signing is switched off::$1 The installer stays unsigned (docs/dev/packaging.md, Signing)."
            echo "provider=" >> "$GITHUB_OUTPUT"
            exit 0
          }
          case "$PROVIDER" in
            signpath) needed="SIGNPATH_ORGANIZATION_ID SIGNPATH_PROJECT_SLUG SIGNPATH_POLICY_SLUG" ;;
            artifact-signing) needed="AZURE_TENANT_ID AZURE_CLIENT_ID ARTIFACT_SIGNING_ENDPOINT ARTIFACT_SIGNING_ACCOUNT ARTIFACT_SIGNING_PROFILE" ;;
            "") off "SIGNING_PROVIDER isn't set." ;;
            *) off "SIGNING_PROVIDER is '$PROVIDER', not signpath or artifact-signing." ;;
          esac
          missing=""
          for name in $needed; do
            [ -n "$(printenv "$name")" ] || missing="$missing $name"
          done
          if [ "$PROVIDER" = "signpath" ] && [ "$SIGNPATH_TOKEN_SET" != "true" ]; then
            missing="$missing SIGNPATH_API_TOKEN"
          fi
          [ -z "$missing" ] || off "$PROVIDER is chosen, but these aren't set:$missing."
          echo "provider=$PROVIDER" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        if: steps.gate.outputs.provider != ''
        with:
          name: CADDCalculator-generic-Windows
          path: unsigned

      - name: Keep only the installer
        if: steps.gate.outputs.provider != ''
        shell: bash
        run: |
          mkdir -p installer signed
          mv unsigned/*-setup.exe installer/

      - name: Upload the unsigned installer for SignPath
        id: unsigned
        if: steps.gate.outputs.provider == 'signpath'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: CADDCalculator-unsigned-installer
          path: installer/*-setup.exe
          if-no-files-found: error

      - name: Sign through SignPath Foundation
        if: steps.gate.outputs.provider == 'signpath'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627  # v2
        with:
          connector-url: https://app.signpath.io/Api/v1/GitHubActions
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Sign in to Azure for Artifact Signing
        if: steps.gate.outputs.provider == 'artifact-signing'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Sign through Microsoft Artifact Signing
        if: steps.gate.outputs.provider == 'artifact-signing'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: installer
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Collect the Artifact Signing result
        if: steps.gate.outputs.provider == 'artifact-signing'
        shell: bash
        run: cp installer/*-setup.exe signed/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: steps.gate.outputs.provider != ''
        with:
          name: CADDCalculator-signed-installer
          path: signed/*-setup.exe
          if-no-files-found: error

  draft-release:
    name: Draft GitHub release
    needs: [build, sign-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: CADDCalculator-generic-*
          path: dist
          merge-multiple: true

      # When signing ran, its installer replaces the unsigned one.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        continue-on-error: true
        with:
          name: CADDCalculator-signed-installer
          path: signed

      - name: Use the signed installer, if there is one
        run: |
          if compgen -G "signed/*-setup.exe" > /dev/null; then cp -f signed/*-setup.exe dist/; fi

      # A draft: the maintainer checks the archives and publishes the release by hand.
      - name: Create a draft release with the generic archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "CADD Calculator $GITHUB_REF_NAME" --generate-notes \
            dist/*.zip dist/*.tar.gz dist/*-setup.exe dist/*.AppImage
