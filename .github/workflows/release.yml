name: Release builds

# Builds and archives the generic edition on version tags, then drafts a release (ADR-0009).
# Branded editions are never built here (ADR-0008 item 4, ADR-0011): the first step fails
# if a branding/ folder exists, and packaging/build.py refuses branded builds in CI.
# Status and limitations: docs/dev/packaging.md, "CI".
#
# Dry runs: a push to the `distribution` branch, or a pull request that touches packaging,
# builds, smoke-tests, and uploads the artifacts on every platform, but never drafts a
# release, signs, or publishes. Only a `v*` tag does those.

on:
  push:
    tags: ["v*"]
    branches: [distribution]
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Generic / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Ubuntu, so the Linux build runs on older glibc too.
        os: [windows-latest, macos-latest, ubuntu-22.04]
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}/../nuitka-cache
    steps:
      - uses: actions/checkout@v7

      - name: Refuse to build with a branding pack in the checkout
        shell: bash
        run: |
          if [ -e branding ]; then
            echo "::error::branding/ must never be in the public repository (ADR-0008 item 4)"
            exit 1
          fi

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 ccache
          echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --extra gui --group build --locked

      - name: Cache Nuitka's compiler downloads and ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          key: nuitka-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: nuitka-${{ runner.os }}-

      - name: Build the generic edition, start it, and archive it
        shell: bash
        run: |
          set -o pipefail
          uv run python packaging/build.py --smoke-test --archive 2>&1 | tee build-output.txt

      # Job logs need a signed-in reader, but annotations are public: put the end of a
      # failed build's output, and of pyside6-deploy's log, where anyone can read it.
      - name: Report a failed build as an annotation
        if: failure()
        shell: bash
        run: |
          for f in build-output.txt builds/generic/work/deploy.log; do
            [ -f "$f" ] || continue
            uv run --no-project python -c "import sys; f = sys.argv[1]; tail = open(f, encoding='utf-8', errors='replace').read().splitlines()[-60:]; print('::error title=' + f + '::' + '%0A'.join(x.replace('%', '%25') for x in tail))" "$f"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: CADDCalculator-generic-${{ runner.os }}
          path: |
            builds/generic/*.zip
            builds/generic/*.tar.gz
            builds/generic/*.build.json
          if-no-files-found: error

  draft-release:
    name: Draft GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # A draft: the maintainer checks the archives and publishes the release by hand.
      - name: Create a draft release with the generic archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "CADD Calculator $GITHUB_REF_NAME" --generate-notes \
            dist/*.zip dist/*.tar.gz
