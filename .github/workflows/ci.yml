name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu pinned: the Linux job installs Qt's runtime libraries by package name,
        # not yet checked on Ubuntu 26 (docs/dev/roadmap.md).
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ["3.12", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: uv sync --extra gui --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Architecture (import layers)
        run: uv run lint-imports

      - name: Test
        run: uv run pytest

  wheel:
    name: Wheel and sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"

      - name: Build
        run: uv build

      # The wheel's catalogs are each language's compiled .mo, and nothing else
      # (ADR-0009's checklist); the .po and .pot stay in the sdist.
      - name: The wheel's catalogs
        run: |
          uv sync --locked
          uv run python scripts/i18n.py check-wheel dist/*.whl
