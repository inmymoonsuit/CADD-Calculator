[project]
name = "cadd-calculator"
dynamic = ["version"]
description = "Open-source calculators for CADD drafting: sheet-metal bends, flat patterns, and more."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "CADD Calculator contributors" }]
license = "Apache-2.0"
license-files = ["LICENSE.md", "TRADEMARKS.md", "THIRD_PARTY_NOTICES.md"]
keywords = ["cad", "cadd", "drafting", "sheet metal", "bend allowance", "flat pattern", "engineering"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
# The core library and calculators use only the standard library (ADR-0003).
dependencies = []

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.8"]

[project.scripts]
caddcalc = "caddcalc.cli:main"

[project.gui-scripts]
caddcalc-gui = "caddcalc.gui.app:main"

[project.urls]
Homepage = "https://github.com/inmymoonsuit/CADD-Calculator"
Issues = "https://github.com/inmymoonsuit/CADD-Calculator/issues"

# Third-party packages register domains and calculators here (ADR-0006, ADR-0013), e.g.:
# [project.entry-points."caddcalc.domains"]
# my_domain = "my_package.module:DOMAIN"
# [project.entry-points."caddcalc.calculators"]
# my_calc = "my_package.module:MyCalculator"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.15",
    "babel>=2.18",
]
# Packaging only: `uv sync --extra gui --group build` (docs/dev/packaging.md).
# Nuitka is pinned deliberately; see ADR-0009. pyside6-deploy needs patchelf on Linux.
build = [
    "nuitka==4.1.1",
    "patchelf>=0.17; sys_platform == 'linux'",
]

[build-system]
# hatchling 1.27+ for PEP 639 license metadata; Babel compiles the catalogs into the wheel
requires = ["hatchling>=1.27", "babel>=2.18"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/caddcalc/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/caddcalc"]
# The catalogs' sources stay in the sdist, for translators; the wheel takes the .mo
exclude = ["/src/caddcalc/locale/**/*.po", "/src/caddcalc/locale/*.pot"]

[tool.hatch.build.targets.wheel.hooks.custom]  # hatch_build.py: the compiled catalogs

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["gui: needs PySide6, and runs with the qt fixture (skipped without PySide6)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "packaging", "scripts"]

[tool.ruff.lint]
# The standard and the reasons for each exclusion: docs/dev/engineering-guidelines.md.
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF",       # correctness and modern Python
    "D",                                               # docstrings (Google convention)
    "N", "C4", "PIE", "RET", "PTH", "TID",             # naming and idioms
    "PGH", "ERA", "BLE", "ARG",                        # no blanket suppressions, dead code, blind except
    "PLE", "PLW",                                      # pylint errors and warnings
    "S",                                               # bandit security checks
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # formula text uses math symbols (· π ° −) on purpose
    "D105", "D107",                # magic methods and __init__ are covered by the class docstring
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1", "S101", "S311"]  # test names document behavior; pytest asserts; seeded data
"packaging/**" = ["S603", "S607"]    # build tools run fixed developer executables

[tool.mypy]
strict = true
files = ["src", "packaging", "scripts"]
python_version = "3.12"

# Architectural boundaries, checked by `uv run lint-imports` (ADR-0003, ADR-0012).
[tool.importlinter]
root_package = "caddcalc"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: CLI, then GUI, then calculators, then core"
type = "layers"
layers = [
    "caddcalc.cli",
    "caddcalc.gui",
    "caddcalc.calculators",
    "caddcalc.core",
]

[[tool.importlinter.contracts]]
name = "Core, calculators, the branding loader, and the style modules never import Qt"
type = "forbidden"
source_modules = [
    "caddcalc.core",
    "caddcalc.calculators",
    "caddcalc.gui.branding",
    "caddcalc.gui.style_tokens",
    "caddcalc.gui.ui_style",
    "caddcalc.gui.outlines",
    "caddcalc.gui.window_layout",
]
forbidden_modules = ["PySide6", "shiboken6"]
